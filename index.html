<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Port Terminal Simulator</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Port Terminal Simulator</h1>
      <span class="level">Level 1</span>
    </div>
    <div class="clock">
      <div class="clock-time" id="clock">Day 1 · 00:00</div>
      <div class="clock-bar"><div id="clock-progress"></div></div>
    </div>
    <div class="controls">
      <button id="btn-play" type="button">▶ Play</button>
      <button class="speed" data-speed="1" type="button" aria-pressed="true">1×</button>
      <button class="speed" data-speed="2" type="button">2×</button>
      <button class="speed" data-speed="4" type="button">4×</button>
      <label class="demo"><input type="checkbox" id="demo"> Watch the algorithm play</label>
    </div>
    <div class="score">
      <div class="score-label">Net cost</div>
      <div class="score-value" id="score">US$0</div>
    </div>
  </header>

  <div class="hint" id="hint" role="status" aria-live="polite"></div>

  <section class="lineup" aria-label="Line-up: ships due in the next 72 hours">
    <h2>Line-up · next 72 h</h2>
    <div class="lineup-track" id="lineup"></div>
  </section>

  <main class="port">
    <section class="anchorage" aria-label="Anchorage queue">
      <h2>Anchorage <span id="queue-count" class="count">0</span></h2>
      <div id="queue" class="cards"></div>
    </section>

    <section class="berths" aria-label="Berths">
      <h2>Berths</h2>
      <div id="berths"></div>
    </section>

    <aside class="stats" aria-label="Statistics">
      <h2>Stats</h2>
      <dl id="stats"></dl>
      <div class="legend">
        <span class="chip chinamax">Chinamax</span>
        <span class="chip capesize">Capesize</span>
        <span class="chip panamax">Panamax</span>
      </div>
    </aside>
  </main>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
